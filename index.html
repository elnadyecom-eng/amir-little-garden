<title>حديقة أمير الصغيرة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen toy app. Hub = 5 big game cards + sticker album. Game = prompt bar (voice) > scene field with hills > Amir guide + round dots. Soft glossy toy style, day / night themes. */
:root{
  --bg1:#BFEAFF; --bg2:#FFF2D2; --card:#FFFFFF; --ink:#26325F; --muted:#66729E; --line:#DCE6FA;
  --coral:#FF6B6B; --coral-d:#E04848; --blue:#4D96FF; --blue-d:#2F77E0; --sun:#FFD93D; --sun-d:#F2B91F; --green:#6BCB77; --green-d:#3FAE52; --pink:#FF8FB1; --purple:#9B7BFF;
  --hill1:#8FDB8A; --hill2:#6CC972; --soft:#F2F6FF; --shadow:rgba(38,50,95,.22);
  --font-d:'Baloo Bhaijaan 2','Tajawal',system-ui,sans-serif; --font-b:'Tajawal','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#0E1738; --bg2:#27397B; --card:#1B2757; --ink:#F2F5FF; --muted:#AEBAE6; --line:#34488A; --soft:#223066;
  --hill1:#2F8A57; --hill2:#237246; --shadow:rgba(0,0,0,.45); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg1:#0E1738; --bg2:#27397B; --card:#1B2757; --ink:#F2F5FF; --muted:#AEBAE6; --line:#34488A; --soft:#223066;
  --hill1:#2F8A57; --hill2:#237246; --shadow:rgba(0,0,0,.45); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--font-b);direction:rtl;font-size:20px;line-height:1.5;overflow:hidden;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px;border-radius:14px}
.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.screen[hidden]{display:none}
#game{justify-content:center}
/* top bar */
.bar{display:flex;align-items:center;gap:8px}
.bar h1{flex:1;margin:0;font:800 clamp(20px,5vw,26px)/1.1 var(--font-d);color:var(--coral);text-align:center;text-wrap:balance}
.rb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#EAF1FF);box-shadow:0 5px 0 rgba(38,50,95,.25),inset 0 -3px 0 rgba(38,50,95,.08);color:var(--ink);flex:none}
.rb svg{width:26px;height:26px}
.rb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(38,50,95,.25)}
.stars{display:flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 10px;border-radius:99px;background:linear-gradient(180deg,#FFE680,var(--sun));box-shadow:0 5px 0 var(--sun-d);font:800 22px var(--font-d);color:#5A4300;flex:none}
.stars svg{width:24px;height:24px;fill:#fff;stroke:#B58300;stroke-width:1.6}
/* hub */
.hello{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:28px;padding:10px 16px;box-shadow:0 8px 0 var(--shadow)}
.hello .h{width:84px;height:84px;flex:none}
.hello .h svg{width:100%;height:100%}
.hello b{display:block;font:800 24px/1.2 var(--font-d)}
.hello span{color:var(--muted);font-weight:700;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;overflow:auto;padding:2px 2px 8px;align-content:start}
.gc{position:relative;border-radius:30px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.22),inset 0 -6px 0 rgba(0,0,0,.14);min-height:150px;transition:transform .12s}
.gc:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.22),inset 0 -6px 0 rgba(0,0,0,.14)}
.gc .ic{width:76px;height:76px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.gc .ic svg{width:100%;height:100%}
.gc b{font:800 21px/1.15 var(--font-d);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.gc .st{display:flex;gap:2px}
.gc .st svg{width:22px;height:22px;fill:rgba(255,255,255,.4);stroke:none}
.gc .st svg.on{fill:#FFE35A;stroke:#B58300;stroke-width:1.2}
.g1{background:linear-gradient(160deg,#FF8A8A,var(--coral-d))}.g2{background:linear-gradient(160deg,#7EB6FF,var(--blue-d))}.g3{background:linear-gradient(160deg,#FFB86B,#EF8A1F)}
.g4{background:linear-gradient(160deg,#B8A1FF,#7B57E6)}.g5{background:linear-gradient(160deg,#7EDC8A,var(--green-d))}
.album{background:var(--card);border-radius:26px;padding:8px 12px 12px;box-shadow:0 6px 0 var(--shadow)}
.album h3{margin:0 0 4px;font:800 18px var(--font-d);color:var(--muted)}
.album .row{display:flex;gap:8px;justify-content:space-between}
.slot{width:calc(20% - 7px);aspect-ratio:1;border-radius:20px;background:var(--soft);display:grid;place-items:center;position:relative}
.slot svg{width:82%;height:82%}
.slot.lock svg{filter:grayscale(1) brightness(.55) opacity(.35)}
.slot.lock::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--line)}
/* game */
.prompt{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:24px;padding:8px 10px 8px 16px;box-shadow:0 6px 0 var(--shadow)}
.prompt p{flex:1;margin:0;font:800 clamp(20px,5.2vw,26px)/1.25 var(--font-d);text-align:center;text-wrap:balance}
.spk{width:60px;height:60px;border-radius:50%;background:linear-gradient(180deg,#FFE680,var(--sun));box-shadow:0 5px 0 var(--sun-d);display:grid;place-items:center;flex:none;animation:pulse 2.4s ease-in-out infinite}
.spk svg{width:30px;height:30px;stroke:#5A4300;fill:none}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-d)}
@keyframes pulse{50%{transform:scale(1.07)}}
.field{position:relative;flex:1;min-height:0;max-height:min(150vw,780px);border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#9BDDFF,#E8F8FF 70%);box-shadow:0 8px 0 var(--shadow),inset 0 0 0 4px rgba(255,255,255,.55);touch-action:none}
:root[data-theme="dark"] .field{background:linear-gradient(180deg,#1A2A6B,#3B52A8 80%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .field{background:linear-gradient(180deg,#1A2A6B,#3B52A8 80%)}}
.field .hills{position:absolute;inset:auto 0 0 0;height:30%;pointer-events:none}
.field .hills svg{width:100%;height:100%;display:block}
.guide{display:flex;align-items:flex-end;gap:8px;height:96px;flex:none}
.guide .fig{height:100%;width:auto;aspect-ratio:160/250;flex:none}
.guide .fig svg{height:100%;width:100%;overflow:visible;display:block}
.guide .say{flex:1;background:var(--card);border-radius:22px;padding:6px 16px;font:800 20px/1.3 var(--font-d);min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 0 var(--shadow);position:relative;margin-bottom:10px}
.guide .say::before{content:"";position:absolute;right:-9px;bottom:14px;border:10px solid transparent;border-left-color:var(--card);border-right:0}
.fig .up{display:none}.fig.cheer .up{display:inline}.fig.cheer .dn{display:none}
.fig{animation:bob 3s ease-in-out infinite;transform-origin:50% 100%}
.fig.cheer{animation:hop .6s ease-out 2}
@keyframes bob{50%{transform:translateY(-4%)}}
@keyframes hop{40%{transform:translateY(-14%)}}
.dotsr{display:flex;gap:8px;justify-content:center;height:16px;flex:none}
.dotsr i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:.3s}
.dotsr i.on{background:var(--green);transform:scale(1.2)}
/* items */
.abs{position:absolute}
.item{position:absolute;display:grid;place-items:center;touch-action:none;cursor:grab;z-index:3;filter:drop-shadow(0 6px 4px rgba(38,50,95,.25));transition:transform .28s cubic-bezier(.2,.8,.3,1.2)}
.item svg{width:100%;height:100%;display:block;pointer-events:none}
.item.drag{transition:none;z-index:9;cursor:grabbing}
.item.sel{outline:5px dashed var(--sun);outline-offset:4px;border-radius:20px}
.item.done{pointer-events:none}
.item.hint,.drop.hint{animation:hint .8s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.14)}}
.drop{position:absolute;display:grid;place-items:center;z-index:2}
.drop svg{width:100%;height:100%;display:block;pointer-events:none}
.drop .lab{position:absolute;bottom:-4px;font:800 18px var(--font-d);color:var(--ink);background:rgba(255,255,255,.85);border-radius:12px;padding:0 10px}
.drop.ok{animation:okpop .5s ease-out}
@keyframes okpop{40%{transform:scale(1.18)}}
.drop.no,.balloon.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.animal .mouth-o{display:none}.animal.eat .mouth-o{display:inline}.animal.eat .mouth-c{display:none}
/* balloons */
.balloon{position:absolute;bottom:0;width:clamp(64px,19%,96px);aspect-ratio:3/4;z-index:3;animation:rise var(--d) linear infinite;animation-delay:var(--dl);cursor:pointer}
.balloon .sw{width:100%;height:100%;animation:sway 3s ease-in-out infinite alternate;animation-delay:var(--dl)}
.balloon svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(38,50,95,.22))}
@keyframes rise{from{transform:translateY(40%)}to{transform:translateY(var(--rise))}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.balloon.gone{display:none}
/* counting */
.apple{position:absolute;width:15%;aspect-ratio:1;z-index:3;cursor:pointer;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(38,50,95,.25))}
.apple svg{width:100%;height:100%;pointer-events:none}
.basket{position:absolute;bottom:4%;left:50%;width:34%;margin-left:-17%;z-index:2}
.big{position:absolute;z-index:8;font:800 60px var(--font-d);color:#fff;-webkit-text-stroke:3px #26325F;pointer-events:none;text-shadow:0 5px 0 #26325F}
.answers{position:absolute;inset:auto 0 3%;display:flex;gap:8px;justify-content:center;z-index:6;padding:0 8px}
.ans{flex:1;max-width:96px;aspect-ratio:.9;border-radius:22px;background:linear-gradient(180deg,#fff,#EEF3FF);box-shadow:0 6px 0 rgba(38,50,95,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 40px/1 var(--font-d);color:var(--ink);gap:4px}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(38,50,95,.3)}
.ans small{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:60px}
.ans small i{width:9px;height:9px;border-radius:50%;background:var(--coral)}
.ans.right{background:linear-gradient(180deg,#9BE8A5,var(--green));color:#fff}
.ans.wrong{animation:shake .4s}
/* overlay */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,28,70,.55);padding:16px}
.ov[hidden]{display:none}
.panel{width:min(420px,100%);background:var(--card);border-radius:34px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 0 var(--shadow);text-align:center;animation:rise2 .4s cubic-bezier(.2,.8,.3,1.2)}
@keyframes rise2{from{transform:scale(.7);opacity:0}}
.panel h2{margin:0;font:800 32px/1.15 var(--font-d);color:var(--coral)}
.panel .stk{width:120px;height:120px;animation:spin 1s ease-out}
.panel .stk svg{width:100%;height:100%}
@keyframes spin{from{transform:scale(0) rotate(-180deg)}}
.pst{display:flex;gap:6px}.pst svg{width:44px;height:44px;fill:var(--line)}.pst svg.on{fill:#FFD93D;stroke:#B58300;stroke-width:1.2;animation:starin .5s ease-out both}
@keyframes starin{from{transform:scale(0)}}
.btn{border-radius:22px;padding:8px 26px;min-height:60px;font:800 24px var(--font-d);color:#fff;background:linear-gradient(180deg,#FF8A8A,var(--coral-d));box-shadow:0 6px 0 #B43434}
.btn.b{background:linear-gradient(180deg,#7EB6FF,var(--blue-d));box-shadow:0 6px 0 #1E58B0}
.btn.g{background:linear-gradient(180deg,#7EDC8A,var(--green-d));box-shadow:0 6px 0 #2B8A3C}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;font:800 22px var(--font-d)}
.sw2{width:64px;height:36px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw2::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.3);transition:.2s}
.sw2[aria-checked="true"]{background:var(--green)}
.sw2[aria-checked="true"]::after{inset-inline-start:32px}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (max-height:640px){.guide{height:74px}.gc{min-height:124px}.gc .ic{width:60px;height:60px}.hello .h{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.balloon{animation:none;bottom:var(--y)}.balloon .sw,.fig,.spk,.apple{animation:none}}
</style>

<div class="app">
  <section class="screen" id="hub" aria-label="القائمة الرئيسية">
    <div class="bar">
      <button class="rb" id="bSet" aria-label="إعدادات الأهل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
      <h1>حديقة أمير الصغيرة</h1>
      <div class="stars" aria-label="مجموع النجوم"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg><span id="tot">٠</span></div>
    </div>
    <div class="hello"><div class="h" id="hubFig"></div><div><b id="hello">أهلًا يا أمير!</b><span>اختر لعبة واجمع الملصقات</span></div></div>
    <div class="grid" id="grid"></div>
    <div class="album"><h3>ألبوم الملصقات</h3><div class="row" id="album"></div></div>
  </section>
  <section class="screen" id="game" hidden aria-label="اللعبة">
    <div class="bar">
      <button class="rb" id="bHome" aria-label="القائمة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
      <h1 id="gTitle"></h1>
      <div class="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg><span id="tot2">٠</span></div>
    </div>
    <div class="prompt"><button class="spk" id="bSpk" aria-label="اسمع التعليمات"><svg viewBox="0 0 24 24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14"/></svg></button><p id="pText"></p></div>
    <div class="field" id="field"></div>
    <div class="guide"><div class="fig" id="gFig"></div><div class="say" id="gSay"></div></div>
    <div class="dotsr" id="dotsr" aria-hidden="true"></div>
  </section>
</div>

<div class="ov" id="ovWin" hidden role="dialog" aria-label="أحسنت"><div class="panel">
  <h2 id="wTitle">أحسنت!</h2><div class="stk" id="wStk"></div><div class="pst" id="wStars"></div><div style="font:700 20px var(--font-b);color:var(--muted)" id="wTxt"></div>
  <div class="btns"><button class="btn g" id="wNext">اللعبة التالية</button><button class="btn b" id="wAgain">مرة أخرى</button></div>
</div></div>
<div class="ov" id="ovSet" hidden role="dialog" aria-label="إعدادات الأهل"><div class="panel">
  <h2 style="color:var(--blue)">إعدادات الأهل</h2>
  <div class="setrow"><span>الصوت والتعليمات</span><button class="sw2" id="tVoice" role="switch" aria-checked="true" aria-label="الصوت"></button></div>
  <div class="setrow"><span>المؤثرات</span><button class="sw2" id="tSound" role="switch" aria-checked="true" aria-label="المؤثرات"></button></div>
  <div class="setrow"><span>الوضع الليلي</span><button class="sw2" id="tNight" role="switch" aria-checked="false" aria-label="الوضع الليلي"></button></div>
  <div class="btns"><button class="btn b" id="sClose">إغلاق</button><button class="btn" id="sReset">مسح التقدم</button></div>
  <div style="font:500 16px var(--font-b);color:var(--muted)" id="sNote">لعبة من ٥ ألعاب قصيرة لطفل عمره ٤ سنوات. لا تحتاج إلى قراءة.</div>
</div></div>

/* ---------- drag engine (drag or tap-then-tap) ---------- */
function dragEngine(items,drops,onResult){
  var selected=null;
  function center(e){var r=e.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
  function targetAt(x,y){var best=null,bd=1e9;drops.forEach(function(t){var r=t.getBoundingClientRect(),pad=26;if(x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad){var c=center(t),d=Math.hypot(c[0]-x,c[1]-y);if(d<bd){bd=d;best=t}}});return best}
  function resolve(it,t){
    if(it.dataset.key===t.dataset.key){var a=center(it),b=center(t);it.dataset.done='1';it.classList.add('done');it.classList.remove('sel','hint');it.style.transform='translate('+(b[0]-a[0])+'px,'+(b[1]-a[1])+'px) scale(.7)';
      later(function(){it.style.opacity='0'},260);t.classList.remove('no','hint');t.classList.add('ok');later(function(){t.classList.remove('ok')},520);selected=null;onResult(true,it,t)}
    else{it.classList.remove('sel');it.style.transform='';t.classList.remove('no');void t.offsetWidth;t.classList.add('no');selected=null;onResult(false,it,t)}}
  items.forEach(function(it){
    var sx=0,sy=0,moved=false,on=false;
    it.addEventListener('pointerdown',function(e){if(it.dataset.done)return;on=true;moved=false;sx=e.clientX;sy=e.clientY;try{it.setPointerCapture(e.pointerId)}catch(_){}it.classList.add('drag');e.preventDefault()});
    it.addEventListener('pointermove',function(e){if(!on)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>8)moved=true;if(moved)it.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)'});
    it.addEventListener('pointerup',function(e){if(!on)return;on=false;it.classList.remove('drag');
      if(!moved){it.style.transform='';var was=it.classList.contains('sel');items.forEach(function(o){o.classList.remove('sel')});if(!was){it.classList.add('sel');selected=it;tone(520,.08)}else selected=null;return}
      var t=targetAt(e.clientX,e.clientY);if(t)resolve(it,t);else{it.style.transform='';sBad()}});
  });
  drops.forEach(function(t){t.addEventListener('click',function(){if(selected)resolve(selected,t)})});
  return {hint:function(){var it=items.filter(function(i){return !i.dataset.done})[0];if(!it)return;var t=drops.filter(function(d){return d.dataset.key===it.dataset.key})[0];it.classList.add('hint');if(t)t.classList.add('hint');later(function(){it.classList.remove('hint');t&&t.classList.remove('hint')},3200)}}}

  var f=c.field,rounds=[['red','أحمر','الحمراء'],['blue','أزرق','الزرقاء']];c.setRounds(rounds.length);var r=0;
  function round(){
    f.querySelectorAll('.balloon').forEach(function(b){b.remove()});
    var T=rounds[r],others=shuffle(['red','blue','yellow','green','purple','orange'].filter(function(x){return x!==T[0]}));
    var list=[];for(var i=0;i<4;i++)list.push(T[0]);for(var j=0;j<5;j++)list.push(others[j%others.length]);list=shuffle(list);
    var left=4,H=f.clientHeight||420;
    c.prompt('اضغط على البالونات '+T[2]);c.say('أين البالونات '+T[2]+'؟');
    list.forEach(function(col,i){var b=el('div','balloon');b.dataset.c=col;var lane=(i+.5)*(100/list.length);b.style.left='calc('+lane+'% - 36px)';
      b.style.setProperty('--d',rnd(11,16).toFixed(1)+'s');b.style.setProperty('--dl',(-rnd(0,12)).toFixed(1)+'s');b.style.setProperty('--rise',-(H+170)+'px');b.style.setProperty('--y',rnd(10,60).toFixed(0)+'%');
      b.innerHTML='<div class="sw">'+balloon(col)+'</div>';b.setAttribute('role','button');b.setAttribute('aria-label','بالون');
      b.onpointerdown=function(e){e.preventDefault();if(b.classList.contains('gone'))return;
        if(col===T[0]){var rc=b.getBoundingClientRect(),fr=f.getBoundingClientRect();burst(f,rc.left+rc.width/2-fr.left,rc.top+rc.height/3-fr.top,COL[col]);b.classList.add('gone');sPop();left--;c.cheer();
          if(left===0){var fin=c.roundDone();later(function(){if(fin)c.finish();else{r++;round()}},900)}}
        else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');c.oops('هذا ليس '+T[1])}};
      f.appendChild(b)});
    c.idle(function(){var t=[].filter.call(f.querySelectorAll('.balloon'),function(b){return b.dataset.c===T[0]&&!b.classList.contains('gone')})[0];if(t){t.classList.add('hint');later(function(){t.classList.remove('hint')},2500)}c.again()})}
  round()};

GAME.feed=function(c){
  var f=c.field;c.setRounds(1);c.prompt('أعطِ كل حيوان الطعام الذي يحبه');
  var an=[['rabbit','الأرنب','carrot','الجزرة للأرنب'],['cat','القطة','fish','السمكة للقطة'],['duck','البطة','corn','الذرة للبطة'],['bear','الدب','honey','العسل للدب']];
  var pos=[[6,5],[54,5],[6,36],[54,36]],drops=[],items=[];
  an.forEach(function(a,i){var d=el('div','drop animal'+'',ANIMAL[a[0]]());d.dataset.key=a[2];d.style.cssText='width:40%;aspect-ratio:1;left:'+pos[i][0]+'%;top:'+pos[i][1]+'%;max-height:30%';d.setAttribute('aria-label',a[1]);d.insertAdjacentHTML('beforeend','<span class="lab">'+a[1]+'</span>');
    d.onclick=function(){speak(a[1])};f.appendChild(d);drops.push(d)});
  var xs=shuffle([3,27,51,75]);
  shuffle(an).forEach(function(a,i){var it=el('div','item',FOOD[a[2]]());it.dataset.key=a[2];it.style.cssText='width:21%;aspect-ratio:1;left:'+xs[i]+'%;bottom:5%';it.setAttribute('aria-label','طعام');f.appendChild(it);items.push(it)});
  var left=4,eng=dragEngine(items,drops,function(ok,it,t){
    if(ok){var an2=t.querySelector('svg');an2.classList.add('eat');t.classList.add('animal');later(function(){an2.classList.remove('eat')},900);left--;c.cheer();if(left===0)later(function(){c.roundDone();c.finish()},1000)}
    else{var s=an.filter(function(a){return a[2]===it.dataset.key})[0][3];c.oops(s)}});
  c.idle(function(){eng.hint();c.again()})};

GAME.count=function(c){
  var f=c.field,Ns=shuffle([3,4,5]).slice(0,2);c.setRounds(2);var r=0;
  var SL=[[26,22],[48,12],[68,24],[36,40],[58,40]];
  function round(){
    f.querySelectorAll('.apple,.answers,.basket,.tree,.big').forEach(function(x){x.remove()});
    var N=Ns[r],words=['واحد','اثنان','ثلاثة','أربعة','خمسة'];
    f.insertAdjacentHTML('beforeend','<div class="abs tree" style="left:15%;right:15%;top:2%;height:60%">'+svg('0 0 100 100','<rect x="44" y="60" width="12" height="40" fill="#8A5A2B" stroke="'+INK+'" stroke-width="2.4"/><circle cx="50" cy="38" r="32" fill="#4CC46A" stroke="'+INK+'" stroke-width="3"/><circle cx="32" cy="46" r="20" fill="#5ED47A"/><circle cx="68" cy="46" r="20" fill="#5ED47A"/>')+'</div>');
    f.insertAdjacentHTML('beforeend','<div class="basket">'+basket('#E8A04C')+'</div>');
    c.prompt('اضغط على كل تفاحة لنعدّها معًا');c.say('هيا نعدّ التفاح!');
    var collected=0,bk=f.querySelector('.basket');
    shuffle(SL).slice(0,N).forEach(function(p){var a=el('button','apple',FRUIT.apple());a.style.left=(p[0]-3)+'%';a.style.top=(p[1]+4)+'%';a.setAttribute('aria-label','تفاحة');
      a.onclick=function(){if(a.dataset.d)return;a.dataset.d='1';collected++;var ar0=a.getBoundingClientRect(),br=bk.getBoundingClientRect(),fr=f.getBoundingClientRect();
        a.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate('+(br.left+br.width/2-ar0.left-ar0.width/2)+'px,'+(br.top+br.height*.2-ar0.top)+'px) scale(.6)'}],{duration:520,easing:'ease-in',fill:'forwards'});
        var n=el('div','big',ar(collected));n.style.left=(ar0.left-fr.left+ar0.width/4)+'px';n.style.top=(ar0.top-fr.top-10)+'px';f.appendChild(n);n.animate([{transform:'scale(.3)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.3},{transform:'translateY(-30px) scale(1)',opacity:0}],{duration:900}).onfinish=function(){n.remove()};
        sPop();speak(words[collected-1]);
        if(collected===N)later(question,900)};
      f.appendChild(a)});
    function question(){
      f.querySelectorAll('.apple').forEach(function(x){x.style.pointerEvents='none'});
      c.prompt('كم تفاحة في السلة؟');var box=el('div','answers'),w=0;
      for(var i=1;i<=5;i++)(function(n){var b=el('button','ans',ar(n)+'<small>'+new Array(n+1).join('<i></i>')+'</small>');b.setAttribute('aria-label',words[n-1]);
        b.onclick=function(){speak(words[n-1]);if(n===N){b.classList.add('right');c.cheer('نعم! '+words[N-1]+' تفاحات');var fin=c.roundDone();later(function(){if(fin)c.finish();else{r++;round()}},1100)}
          else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');c.oops('عدّ مرة ثانية')}};box.appendChild(b)})(i);
      f.appendChild(box)}
    c.idle(function(){var t=[].filter.call(f.querySelectorAll('.apple'),function(a){return !a.dataset.d})[0];if(t){t.style.outline='5px dashed #FFD93D';t.style.borderRadius='50%';later(function(){t.style.outline=''},2500)}c.again()})}
  round()};

GAME.shadow=function(c){
  var f=c.field;c.setRounds(1);c.prompt('ضع كل شكل فوق ظله');
  var sh=[['circle','red'],['square','blue'],['triangle','yellow'],['star','green']],drops=[],items=[];
  var pos=shuffle([3,27,51,75]);
  sh.forEach(function(s,i){var d=el('div','drop',shape(s[0],INK,.32));d.dataset.key=s[0];d.style.cssText='width:21%;aspect-ratio:1;left:'+pos[i]+'%;top:14%;border:3px dashed rgba(38,50,95,.35);border-radius:22px;background:rgba(255,255,255,.35)';d.setAttribute('aria-label','ظل');f.appendChild(d);drops.push(d)});
  var xs=shuffle([3,27,51,75]);
  shuffle(sh).forEach(function(s,i){var it=el('div','item',shape(s[0],COL[s[1]]));it.dataset.key=s[0];it.style.cssText='width:21%;aspect-ratio:1;left:'+xs[i]+'%;bottom:7%';it.setAttribute('aria-label','شكل');f.appendChild(it);items.push(it)});
  var left=4,eng=dragEngine(items,drops,function(ok,it,t){
    if(ok){t.innerHTML=shape(it.dataset.key,COL[sh.filter(function(s){return s[0]===it.dataset.key})[0][1]]);t.style.border='3px solid transparent';t.style.background='none';left--;c.cheer();if(left===0)later(function(){c.roundDone();c.finish()},900)}
    else c.oops('ابحث عن الظل المناسب')});
  c.idle(function(){eng.hint();c.again()})};

GAME.sort=function(c){
  var f=c.field;c.setRounds(1);c.prompt('ضع كل فاكهة في السلة التي بلونها');
  var B=[['red','#FF5A5F','أحمر'],['yellow','#FFC933','أصفر'],['green','#4CC46A','أخضر']],drops=[],items=[];
  B.forEach(function(b,i){var d=el('div','drop',basket(b[1]));d.dataset.key=b[0];d.style.cssText='width:30%;aspect-ratio:1.25;left:'+(2+i*33)+'%;bottom:4%';d.insertAdjacentHTML('beforeend','<span class="lab">'+b[2]+'</span>');d.setAttribute('aria-label','سلة '+b[2]);f.appendChild(d);drops.push(d)});
  var fr=shuffle([['apple','red'],['banana','yellow'],['leaf','green'],['strawberry','red'],['lemon','yellow'],['cucumber','green']]);
  fr.forEach(function(x,i){var it=el('div','item',FRUIT[x[0]]());it.dataset.key=x[1];it.style.cssText='width:19%;aspect-ratio:1;left:'+(5+(i%3)*31)+'%;top:'+(6+Math.floor(i/3)*24)+'%';it.setAttribute('aria-label','فاكهة');f.appendChild(it);items.push(it)});
  var left=6,eng=dragEngine(items,drops,function(ok,it,t){
    if(ok){left--;c.cheer();if(left===0)later(function(){c.roundDone();c.finish()},900)}
    else c.oops('انظر إلى لون الفاكهة')});
  c.idle(function(){eng.hint();c.again()})};

/* ---------- navigation, settings ---------- */
var curId=null;
function route(h){h=h||'hub';if(h===curId)return;curId=h;var gm=GAMES.filter(function(g){return g.id===h})[0];$('#ovWin').hidden=true;if(gm)startGame(gm);else{curId='hub';showView('hub');drawHub()}}
function nav(h){try{location.hash=h}catch(e){}route(h)}
window.addEventListener('hashchange',function(){route(location.hash.replace('#','')||'hub')});
$('#bHome').onclick=function(){nav('hub')};
function sw(id,key,fn){var b=$(id);b.setAttribute('aria-checked',key());b.onclick=function(){var v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);fn(v)}}
sw('#tVoice',function(){return S.voice},function(v){S.voice=v;save();if(!v){try{speechSynthesis.cancel()}catch(e){}}});
sw('#tSound',function(){return S.sound},function(v){S.sound=v;save()});
sw('#tNight',function(){return matchMedia('(prefers-color-scheme: dark)').matches},function(v){document.documentElement.setAttribute('data-theme',v?'dark':'light')});
$('#bSet').onclick=function(){$('#ovSet').hidden=false};$('#sClose').onclick=function(){$('#ovSet').hidden=true};
var armed=false;$('#sReset').onclick=function(){var b=$('#sReset');if(!armed){armed=true;b.textContent='اضغط للتأكيد';setTimeout(function(){armed=false;b.textContent='مسح التقدم'},3000);return}armed=false;b.textContent='مسح التقدم';S.stars={};S.stickers={};save();drawHub();$('#ovSet').hidden=true};
try{speechSynthesis.getVoices()}catch(e){}
route(location.hash.replace('#','')||'hub');
})();
</script>
